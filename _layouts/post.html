---
layout: default
---

<!-- BLOG POST TERMINAL WINDOW -->
<div class="terminal-window">
    <div class="terminal-titlebar">
        <div class="btn btn-close"></div>
        <div class="btn btn-min"></div>
        <div class="btn btn-max"></div>
        <div class="window-title">strange-attractor: ~/posts/{{ page.slug | default: page.title | slugify }}</div>
    </div>
    <div class="terminal-body">
        <header class="post-header">
            <div class="post-meta">
                <span>{{ page.date | date: "%B %d, %Y" }}</span>
                {% if page.read_time %}<span>{{ page.read_time }}</span>{% endif %}
                {% if page.category %}<span class="category-badge">{{ page.category }}</span>{% endif %}
            </div>
            <h1 class="post-title">{{ page.title }}</h1>
        </header>

        <div class="post-content">
            {{ content }}
        </div>

        <footer class="post-footer"></footer>
    </div>
</div>
